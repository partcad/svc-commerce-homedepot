partcad: ">=0.8.0"
name: //pub/svc/commerce/homedepot
desc: The Home Depot online store.

docs:
  intro: |
    This package can be used for cost estimation for assemblies that use Homedepot parts.
    Placing orders is not implemented yet.

    Its dimensional lumber and plywood are declared as instances of the
    standard sizes in `//pub/std/imperial/dimensional-lumber`. The generic
    templates `dimensional-lumber` and `plywood` are the store's products of
    any size, with no SKU; each stocked product is an `enrich` of one of them
    at its nominal size, with the SKU it is sold under. A part cut to size from
    one names it as its stock:

    ```yaml
    manufacturing:
      method: subtractive
      source: //pub/svc/commerce/homedepot:lumber/4x4x8
      cut:
        cuts:
          - along: +Y
            length: $length in
    ```

    Its screws for wood are instances of one template too, `wood-screw`, drawn
    from the sizes their product pages give: a screw's `tip` is put against the
    place it goes in, and a connection's `drive` takes it in that far - which
    is what the ports of `//pub/std/imperial/dimensional-lumber` take:

    ```yaml
    - part: //pub/svc/commerce/homedepot:screws/sdws22600db
      connect:
        name: apron
        to: //pub/std/imperial/dimensional-lumber:cuboid
        toPort: y0-x0
        toParams: { fromEdge: 25.4, drive: 63.5 }
        withPort: tip
        how: { selfScrew: true }
    ```

  usage: |
    Get an estimate for 4 mm-0.7 Zinc-Plated Metric Hex Nut:

    ```shell
    $ pc supply quote --provider homedepot hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece
    ...
    INFO:  The following quotes are received:
    INFO:           //pub/svc/commerce/homedepot:homedepot: HB100174664951: $1.44
    INFO:                   hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece#1
    ...
    ```

    Get an estimate for an 8 ft. 4x4:

    ```shell
    $ pc supply quote --provider homedepot lumber/4x4x8
    ```

dependencies:
  pub:
    onlyInRoot: true
    type: git
    url: https://github.com/partcad/partcad-index.git

# The store supplies its own products: a part of this package is looked for at
# the providers this package lists.
suppliers:
  homedepot:

providers:
  homedepot:
    type: store
    parameters:
      discountCode:
        type: string

render:
  readme:

parts:
  hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece:
    desc: 4 mm-0.7 Zinc-Plated Metric Hex Nut
    vendor: homedepot
    sku: "204275876"
    count_per_sku: 2
    url: https://www.homedepot.com/p/Everbilt-4-mm-0-7-Zinc-Plated-Metric-Hex-Nut-2-Piece-803738/204275876
    type: step # This model is sourced from https://grabcad.com/library/hexagonal-nut-m4-m5-m6-1

  hardware/fasteners/bolts/hex_bolts/m4_0_7_x_20_mm_zinc_plated_hex_bolts_2_pieces:
    desc: M4-0.7 x 20 mm Class 8.8 Zinc Plated Hex Bolt
    vendor: homedepot
    sku: "204273651"
    count_per_sku: 2
    url: https://www.homedepot.com/p/M4-0-7-x-20-mm-Class-8-8-Zinc-Plated-Hex-Bolt-2-Pack-801268/204273651
    type: step # This model is sourced from https://grabcad.com/library/hexagonal-bolt-m4-m5-m6-1

  # Screws for wood.
  #
  # One generic template, 'wood-screw': a screw of any size, drawn by
  # 'hardware/fasteners/screws/wood_screw.py' from the sizes a product page
  # gives, in inches. It carries the vendor and no SKU, as the lumber templates
  # below do, and each product is an instance of it with the SKU it is sold
  # under and as many to the SKU as come in the box.
  #
  # A screw is drawn along Z, point down, with z = 0 the plane that is flush
  # with the surface once it is driven home. Its two ports have +Z into the
  # screw, as everywhere: 'tip' at the point, with +Z up the shank, which is
  # what is put against the place the screw goes in, and 'head' where a
  # driver's bit goes, with +Z down the shank.
  wood-screw:
    desc: A screw for wood, by its sizes (any size; see the products below for what is stocked)
    type: cadquery
    path: hardware/fasteners/screws/wood_screw.py
    vendor: homedepot
    parameters:
      length:
        type: float
        desc: The length in inches - overall for a flat head, from under the head for a washer head
        default: 2.0
      diameter:
        type: float
        desc: The thread's major diameter in inches
        default: 0.164
      shank:
        type: float
        desc: The diameter of the plain shank between the head and the thread, in inches
        default: 0.12
      thread_length:
        type: float
        desc: The length of the thread in inches
        default: 1.24
      head:
        type: string
        desc: The kind of head - "flat" (countersunk, flush with the surface) or "washer" (on it)
        enum: [flat, washer]
        default: flat
      head_diameter:
        type: float
        desc: The diameter of the head in inches
        default: 0.31
      head_height:
        type: float
        desc: How far a washer head stands above the surface, in inches
        default: 0.0
    ports:
      tip: [[0, 0, "%-length * 25.4%"], [0, 0, 1], 0]
      head: [[0, 0, "%head_height * 25.4 if head == 'washer' else 0%"], [1, 0, 0], 180]

  screws/sdws22600db:
    desc: Simpson Strong-Tie 0.220 in. x 6 in. T40 Washer Head Strong-Drive SDWS Timber Screw, Exterior Grade (12-Pack)
    # https://www.homedepot.com/p/Simpson-Strong-Tie-0-220-in-x-6-in-T40-Washer-Head-Strong-Drive-SDWS-Timber-Screw-Exterior-Grade-12-Pack-SDWS22600DB-R12/321563353
    # The sizes are the ones the retailers list for SDWS22600DB: a 3 in. thread
    # and a 0.76 in. low-profile washer head.
    type: enrich
    source: wood-screw
    with:
      length: 6
      diameter: 0.22
      shank: 0.17
      thread_length: 3
      head: washer
      head_diameter: 0.76
      head_height: 0.12
    vendor: homedepot
    sku: "321563353"
    count_per_sku: 12

  screws/spax-8x2:
    desc: "SPAX #8 x 2 in. T-Star Plus Drive Flat-Head Partial Thread Yellow Zinc Coated Multi-Material Screw (161-Box)"
    # https://www.homedepot.com/p/202040969
    # A #8 is 0.164 in. across the thread, which is 1.24 in. long.
    type: enrich
    source: wood-screw
    with:
      length: 2
      diameter: 0.164
      shank: 0.12
      thread_length: 1.24
      head: flat
      head_diameter: 0.31
    vendor: homedepot
    sku: "202040969"
    count_per_sku: 161

  # Dimensional lumber and plywood.
  #
  # Two generic templates, 'dimensional-lumber' and 'plywood': what this store
  # sells, of any size, as the standard part it is a size of
  # ('//pub/std/imperial/dimensional-lumber'). They are the store's products in
  # general and not one of them in particular, so they carry the vendor and no
  # SKU -- there is nothing to order until a size is chosen.
  #
  # Each product is then an instance of a template at the product's nominal
  # size, with the SKU it is sold under. So the geometry is the standard's, in
  # the standard's frame (width along X, length along Y, thickness along Z),
  # and a part cut to size from one of these names it as its stock in those
  # same coordinates. See '//pub/furniture/workspace/basic:imperial-desk-1'.

  dimensional-lumber:
    desc: Dimensional lumber, by its nominal size (any size; see the products below for what is stocked)
    type: alias
    source: //pub/std/imperial/dimensional-lumber:lumber
    vendor: homedepot

  plywood:
    desc: Plywood panels, by their nominal thickness (any size; see the products below for what is stocked)
    type: alias
    source: //pub/std/imperial/dimensional-lumber:plywood
    vendor: homedepot

  lumber/2x4x8:
    desc: "2 in. x 4 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-4-in-x-8-ft-2-Premium-2-Grade-Fir-Dimensional-Lumber-441317/202094172
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 2
      length: 96
    vendor: homedepot
    sku: "202094172"
    count_per_sku: 1

  lumber/2x4x20:
    desc: "2 in. x 4 in. x 20 ft. #2 Premium Grade Hem-Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-4-in-x-20-ft-2-Premium-Grade-Hem-Fir-Dimensional-Lumber-82271/202083072
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 2
      length: 240
    vendor: homedepot
    sku: "202083072"
    count_per_sku: 1

  lumber/2x6x8:
    desc: "2 in. x 6 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-6-in-x-8-ft-2-Premium-Grade-Fir-Dimensional-Lumber-603643/100026460
    type: enrich
    source: dimensional-lumber
    with:
      width: 6
      height: 2
      length: 96
    vendor: homedepot
    sku: "100026460"
    count_per_sku: 1

  lumber/4x4x8:
    desc: "4 in. x 4 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/4-in-x-4-in-x-8-ft-2-Premium-Grade-Fir-Dimensional-Lumber-441856/202094374
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 4
      length: 96
    vendor: homedepot
    sku: "202094374"
    count_per_sku: 1

  plywood/23-32x4x8:
    desc: 23/32 in. x 4 ft. x 8 ft. BC Sanded Pine Plywood
    # https://www.homedepot.com/p/Plytanium-23-32-in-x-4-ft-x-8-ft-BC-Sanded-Pine-Plywood-201428/100061386
    type: enrich
    source: plywood
    with:
      width: 48
      length: 96
      thickness: 0.75
    vendor: homedepot
    sku: "100061386"
    count_per_sku: 1

assemblies:
  hardware/fasteners/fastener_assembly:
    type: assy
