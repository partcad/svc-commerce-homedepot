partcad: ">=0.8.0"
name: //pub/svc/commerce/homedepot
desc: The Home Depot online store.

docs:
  intro: |
    This package can be used for cost estimation for assemblies that use Homedepot parts.
    Placing orders is not implemented yet.

    Its dimensional lumber and plywood are declared as instances of the
    standard sizes in `//pub/std/imperial/dimensional-lumber`. The generic
    templates `dimensional-lumber` and `plywood` are the store's products of
    any size, with no SKU; each stocked product is an `enrich` of one of them
    at its nominal size, with the SKU it is sold under. A part cut to size from
    one names it as its stock:

    ```yaml
    manufacturing:
      method: subtractive
      source: //pub/svc/commerce/homedepot:lumber/4x4x8
      cut:
        cuts:
          - along: +Y
            length: $length in
    ```

    The store's products that a PartCAD standard describes are served as
    `//pub/svc/commerce/homedepot/catalog`, one sub-package per category
    (`lumber`, `plywood`, `bolts`, `screws`, `nuts`, `washers`), each product
    a part named by its item ID. The lumber and plywood are instances of the
    standard sizes, and the metric fasteners implement the
    `//pub/std/metric/m` interfaces. See `catalog-plugin/README.md`.

  usage: |
    Get an estimate for 4 mm-0.7 Zinc-Plated Metric Hex Nut:

    ```shell
    $ pc supply quote --provider homedepot hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece
    ...
    INFO:  The following quotes are received:
    INFO:           //pub/svc/commerce/homedepot:homedepot: HB100174664951: $1.44
    INFO:                   hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece#1
    ...
    ```

    Get an estimate for an 8 ft. 4x4:

    ```shell
    $ pc supply quote --provider homedepot lumber/4x4x8
    ```

    Browse the catalog, and put its fasteners together by their interfaces:

    ```shell
    $ pc list parts //pub/svc/commerce/homedepot/catalog/bolts
    $ pc info //pub/svc/commerce/homedepot/catalog/bolts:204273651
    $ pc inspect -a hardware/fasteners/catalog_assembly
    ```

dependencies:
  pub:
    onlyInRoot: true
    type: git
    url: https://github.com/partcad/partcad-index.git

  # The store's catalog, served by the 'catalog_repo' plugin as
  # //pub/svc/commerce/homedepot/catalog: one sub-package per category, each
  # holding the products a PartCAD standard describes, named by their item ID.
  # See catalog-plugin/README.md.
  #
  # The plugin's files are in 'catalog-plugin/' and not in 'catalog/', and that
  # is not a matter of taste: PartCAD resolves '.../homedepot/catalog' by
  # looking for a sub-folder of that name before it looks at these
  # dependencies, and a folder without a partcad.yaml in it ends the search.
  catalog:
    type: external
    plugin: :catalog_repo
    desc: The store's dimensional lumber, plywood and metric fasteners, by category.

repositories:
  catalog_repo:
    type: basic
    path: catalog-plugin/catalog_repo.py
    desc: Serves the store's products that a PartCAD standard describes, from catalog-plugin/products.jsonl.

# The store supplies its own products: a part of this package is looked for at
# the providers this package lists.
suppliers:
  homedepot:

providers:
  homedepot:
    type: store
    parameters:
      discountCode:
        type: string

render:
  readme:

parts:
  hardware/fasteners/nuts/hex_nuts/4_mm_0_7_zinc_plated_metric_hex_nut_2_piece:
    desc: 4 mm-0.7 Zinc-Plated Metric Hex Nut
    vendor: homedepot
    sku: "204275876"
    count_per_sku: 2
    url: https://www.homedepot.com/p/Everbilt-4-mm-0-7-Zinc-Plated-Metric-Hex-Nut-2-Piece-803738/204275876
    type: step # This model is sourced from https://grabcad.com/library/hexagonal-nut-m4-m5-m6-1

  hardware/fasteners/bolts/hex_bolts/m4_0_7_x_20_mm_zinc_plated_hex_bolts_2_pieces:
    desc: M4-0.7 x 20 mm Class 8.8 Zinc Plated Hex Bolt
    vendor: homedepot
    sku: "204273651"
    count_per_sku: 2
    url: https://www.homedepot.com/p/M4-0-7-x-20-mm-Class-8-8-Zinc-Plated-Hex-Bolt-2-Pack-801268/204273651
    type: step # This model is sourced from https://grabcad.com/library/hexagonal-bolt-m4-m5-m6-1

  # Dimensional lumber and plywood.
  #
  # Two generic templates, 'dimensional-lumber' and 'plywood': what this store
  # sells, of any size, as the standard part it is a size of
  # ('//pub/std/imperial/dimensional-lumber'). They are the store's products in
  # general and not one of them in particular, so they carry the vendor and no
  # SKU -- there is nothing to order until a size is chosen.
  #
  # Each product is then an instance of a template at the product's nominal
  # size, with the SKU it is sold under. So the geometry is the standard's, in
  # the standard's frame (width along X, length along Y, thickness along Z),
  # and a part cut to size from one of these names it as its stock in those
  # same coordinates. See '//pub/furniture/workspace/basic:imperial-desk-1'.

  dimensional-lumber:
    desc: Dimensional lumber, by its nominal size (any size; see the products below for what is stocked)
    type: alias
    source: //pub/std/imperial/dimensional-lumber:lumber
    vendor: homedepot

  plywood:
    desc: Plywood panels, by their nominal thickness (any size; see the products below for what is stocked)
    type: alias
    source: //pub/std/imperial/dimensional-lumber:plywood
    vendor: homedepot

  # Metric nuts and washers, as cq_warehouse draws them.
  #
  # The same two kinds of template, for the fasteners the catalog sells that
  # //pub/std/metric/cqwarehouse has no part for: it publishes cq_warehouse's
  # screws and none of its nuts or washers. These are those, asked of the same
  # library, and they belong there beside the screws - once they are, these
  # become aliases of them. Each is placed the way cq_warehouse places it, on
  # the XY plane with its bearing face at Z=0, which is where the catalog puts
  # the ports of the //pub/std/metric/m interfaces each product implements.

  metric-nut:
    desc: Metric nuts, by their thread and their standard (any size; see the catalog for what is stocked)
    type: cadquery
    path: catalog-plugin/metric_nut.py
    vendor: homedepot
    pythonRequirements:
      - git+https://github.com/gumyr/cq_warehouse.git@v0.8.0#egg=cq_warehouse
    parameters:
      size:
        type: string
        desc: The thread, as cq_warehouse names it ("M6-1", "M8-1.25")
        default: M6-1
      fastener_type:
        type: string
        desc: >
          ISO 4032 (a regular hex nut), ISO 4033 (high), ISO 4035 (thin, a jam
          nut), DIN 1665 (with a flange) or DIN 1587 (a domed cap nut)
        enum: [iso4032, iso4033, iso4035, din1665, din1587]
        default: iso4032
      simple:
        type: bool
        desc: Leave the thread out, as a plain bore at the thread's major diameter
        default: true
      hand:
        type: string
        enum: [right, left]
        default: right

  metric-washer:
    desc: Metric plain washers, by the screw they take and their standard (any size; see the catalog for what is stocked)
    type: cadquery
    path: catalog-plugin/metric_washer.py
    vendor: homedepot
    pythonRequirements:
      - git+https://github.com/gumyr/cq_warehouse.git@v0.8.0#egg=cq_warehouse
    parameters:
      size:
        type: string
        desc: The screw size it is for ("M6")
        default: M6
      fastener_type:
        type: string
        desc: ISO 7089 (a plain washer) or ISO 7093 (the large series, a fender washer)
        enum: [iso7089, iso7093]
        default: iso7089

  lumber/2x4x8:
    desc: "2 in. x 4 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-4-in-x-8-ft-2-Premium-2-Grade-Fir-Dimensional-Lumber-441317/202094172
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 2
      length: 96
    vendor: homedepot
    sku: "202094172"
    count_per_sku: 1

  lumber/2x4x20:
    desc: "2 in. x 4 in. x 20 ft. #2 Premium Grade Hem-Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-4-in-x-20-ft-2-Premium-Grade-Hem-Fir-Dimensional-Lumber-82271/202083072
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 2
      length: 240
    vendor: homedepot
    sku: "202083072"
    count_per_sku: 1

  lumber/2x6x8:
    desc: "2 in. x 6 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/2-in-x-6-in-x-8-ft-2-Premium-Grade-Fir-Dimensional-Lumber-603643/100026460
    type: enrich
    source: dimensional-lumber
    with:
      width: 6
      height: 2
      length: 96
    vendor: homedepot
    sku: "100026460"
    count_per_sku: 1

  lumber/4x4x8:
    desc: "4 in. x 4 in. x 8 ft. #2 Premium Grade Fir Dimensional Lumber"
    # https://www.homedepot.com/p/4-in-x-4-in-x-8-ft-2-Premium-Grade-Fir-Dimensional-Lumber-441856/202094374
    type: enrich
    source: dimensional-lumber
    with:
      width: 4
      height: 4
      length: 96
    vendor: homedepot
    sku: "202094374"
    count_per_sku: 1

  plywood/23-32x4x8:
    desc: 23/32 in. x 4 ft. x 8 ft. BC Sanded Pine Plywood
    # https://www.homedepot.com/p/Plytanium-23-32-in-x-4-ft-x-8-ft-BC-Sanded-Pine-Plywood-201428/100061386
    type: enrich
    source: plywood
    with:
      width: 48
      length: 96
      thickness: 0.75
    vendor: homedepot
    sku: "100061386"
    count_per_sku: 1

assemblies:
  hardware/fasteners/fastener_assembly:
    type: assy

  hardware/fasteners/catalog_assembly:
    type: assy
